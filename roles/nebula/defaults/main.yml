---
# Nebula role defaults

nebula_state: present

nebula_version: "1.10.3"
nebula_arch: "linux-amd64"
nebula_install_dir: /usr/local/bin
nebula_config_dir: /etc/nebula

# Command (argv) that writes the host's config on the controller; `--output <file>`
# and the host name are appended.
nebula_config_generate_command:
  - uv
  - run
  - nebula-config
  - --pki-base-path
  - "{{ playbook_dir }}/../../nebula-config"
  - --config
  - "{{ playbook_dir }}/../../nebula-config/nebula-network.config.yml"
  - config
  - generate

# Check the generated config with `nebula -test` on the host before it replaces
# the running one, so a config whose certificate does not match the host key
# never reaches the service.
nebula_config_validate: false

# Keep the host's private key on the host: generate the key pair there
# (`<nebula_config_dir>/host.key`, `host.pub`) when it is missing, and sign the
# public key on the controller with `nebula_host_cert_sign_command`. The generated
# config must then reference the key by path instead of carrying it.
nebula_host_key_manage: false
# The curve of the CA that signs the key: 25519 or P256.
nebula_host_key_curve: "25519"
# Command (argv) run on the controller to sign the public key; the host name and
# the path of a controller-side copy of the public key are appended. Required
# with nebula_host_key_manage.
nebula_host_cert_sign_command: []
# Sign the existing key again, as for a new CA. A key generated in this run is
# signed regardless.
nebula_host_cert_sign: false
