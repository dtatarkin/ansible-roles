---
- name: Ensure nebula config directory exists
  ansible.builtin.file:
    path: "{{ nebula_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Manage the host key
  ansible.builtin.include_tasks: host_key.yml
  when: nebula_host_key_manage | bool

- name: Create temporary config file
  ansible.builtin.tempfile:
    state: file
    suffix: .nebula-config.yml
  delegate_to: localhost
  become: false
  changed_when: false
  register: nebula_config_tmpfile

- name: Generate nebula config
  ansible.builtin.command:
    argv: "{{ nebula_config_generate_command + ['--output', nebula_config_tmpfile.path, inventory_hostname] }}"
  delegate_to: localhost
  become: false
  changed_when: false

- name: Copy generated config to remote host
  ansible.builtin.copy:
    src: "{{ nebula_config_tmpfile.path }}"
    dest: "{{ nebula_config_dir }}/config.yml"
    owner: root
    group: root
    mode: "0600"
    validate: "{{ (nebula_install_dir ~ '/nebula -test -config %s') if nebula_config_validate | bool else omit }}"
  diff: false
  notify: Restart nebula

- name: Clean up temporary config file
  ansible.builtin.file:
    path: "{{ nebula_config_tmpfile.path }}"
    state: absent
  delegate_to: localhost
  become: false
  changed_when: false
