---
- name: Remove Metabase
  ansible.builtin.include_tasks: remove.yml
  when: metabase_state == 'absent'

- name: Read metabase secrets from SOPS
  ansible.builtin.include_tasks: secret.yml
  when: metabase_state == 'present'

# K3s keeps the completed helm-install job until the HelmChart spec changes and
# replaces it some seconds after. Waiting on the job by name right after the
# deploy accepts the previous, completed one (seen on a v0.63.20 -> v0.64.3
# upgrade: the play ended `ok` while the old pod was still terminating), so the
# HelmChart generation and the job UID are recorded before anything changes.
- name: Read the current Metabase HelmChart generation
  ansible.builtin.command:
    cmd: kubectl -n kube-system get helmchart metabase --ignore-not-found -o 'jsonpath={.metadata.generation}'
  changed_when: false
  register: metabase_helmchart_generation_before
  when: metabase_state == 'present'

- name: Read the current Metabase Helm install job UID
  ansible.builtin.command:
    cmd: kubectl -n kube-system get job helm-install-metabase --ignore-not-found -o 'jsonpath={.metadata.uid}'
  changed_when: false
  register: metabase_helm_job_uid_before
  when: metabase_state == 'present'

- name: Deploy Metabase
  ansible.builtin.include_tasks: deploy.yml
  when: metabase_state == 'present'

- name: Wait for the Metabase Helm release of this run
  when: metabase_state == 'present' and not ansible_check_mode
  block:
    # The K3s manifest watcher applies the file on its own schedule. Applying the
    # same HelmChart here returns its generation at once: a higher one means K3s
    # replaces the Helm install job, an equal one means nothing is reinstalled.
    - name: Apply the Metabase HelmChart as a reconciliation barrier
      ansible.builtin.command:
        cmd: >-
          kubectl apply -f /var/lib/rancher/k3s/server/manifests/metabase-helmchart.yml
          -o 'jsonpath={.metadata.generation}'
      register: metabase_helmchart_generation_after
      changed_when: >-
        metabase_helmchart_generation_after.stdout | int
        > metabase_helmchart_generation_before.stdout | int

    - name: Decide whether K3s reinstalls the Metabase Helm release
      ansible.builtin.set_fact:
        metabase_helm_reinstall: >-
          {{
            metabase_helmchart_generation_before.stdout | length == 0
            or metabase_helmchart_generation_after.stdout | int
            > metabase_helmchart_generation_before.stdout | int
          }}

    - name: Wait for K3s to replace the Metabase Helm install job
      ansible.builtin.command:
        cmd: kubectl -n kube-system get job helm-install-metabase --ignore-not-found -o 'jsonpath={.metadata.uid}'
      changed_when: false
      register: metabase_helm_job_uid_after
      retries: 60
      delay: 5
      until:
        - metabase_helm_job_uid_after.stdout | length > 0
        - metabase_helm_job_uid_after.stdout != metabase_helm_job_uid_before.stdout
      when: metabase_helm_reinstall

    # The exact job of this run when it reinstalls. Otherwise whichever job
    # carries the name: an interrupted earlier run or a K3s upgrade can replace
    # it without a new generation, and the image and version checks in
    # verify.yml decide whether that job brought the target release.
    - name: Wait for the Metabase Helm install job to complete
      ansible.builtin.command:
        cmd: >-
          kubectl -n kube-system get job helm-install-metabase --ignore-not-found
          -o 'jsonpath={.metadata.uid}|{.status.conditions[?(@.type=="Complete")].status}'
      changed_when: false
      register: metabase_helm_job
      retries: 60
      delay: 5
      until: >-
        metabase_helm_job.stdout == metabase_helm_job_uid_after.stdout ~ '|True'
        if metabase_helm_reinstall
        else metabase_helm_job.stdout.endswith('|True')
      when: metabase_helm_reinstall or metabase_helm_job_uid_before.stdout | length > 0

- name: Verify Metabase
  ansible.builtin.include_tasks: verify.yml
  when: metabase_state == 'present' and not ansible_check_mode
