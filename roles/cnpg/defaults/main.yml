---

# Role state: 'present' to deploy, 'absent' to remove
cnpg_state: present
# Set to true to delete PVCs when state is absent
cnpg_purge_data: false

# CloudNativePG operator Helm chart settings
cnpg_chart_version: "0.27.1"
cnpg_chart_repo: "https://cloudnative-pg.github.io/charts"
cnpg_operator_namespace: cnpg-system

# Optional CPU/memory requests/limits for the PostgreSQL instance pods.
# Empty by default → CloudNativePG applies no resource constraints (BestEffort).
# Example: {requests: {cpu: 200m, memory: 512Mi}}
cnpg_resources: {}

# Extra PostgreSQL settings merged into the Cluster's spec.postgresql.parameters.
# Empty by default → only CloudNativePG's own defaults apply, which for memory
# leaves the PostgreSQL built-ins in force (work_mem 4MB, shared_buffers 128MB).
# Sizing these is a workload measurement the consuming deployment owns, so the
# role ships no values; set them in the consumer's inventory.
# Example: {work_mem: 16MB}
#
# Values must be YAML strings — CloudNativePG rejects a bare number, so write
# `max_connections: "200"`, not `max_connections: 200`.
#
# How a change is applied depends on the setting's PostgreSQL context:
#   - `user`/`superuser` context (work_mem, hash_mem_multiplier) → config reload,
#     no downtime;
#   - `postmaster` context (shared_buffers, max_connections, wal_buffers) →
#     CloudNativePG restarts the instance. With `cnpg_instances: 1` that is a
#     full outage of every database in the cluster, so check the context before
#     adding a setting here.
cnpg_postgresql_parameters: {}

# PostgreSQL Cluster settings
cnpg_namespace: postgres
cnpg_cluster_name: postgres
cnpg_instances: 1
cnpg_pg_image: "ghcr.io/cloudnative-pg/postgresql:17.4"
cnpg_storage_class: local-path
cnpg_storage_size: 5Gi

# NodePort exposure is a consumer allocation — no default. Define
# cnpg_node_port in inventory to add the NodePort service to the Cluster;
# leave unset to skip it.
# cnpg_node_port: (from inventory)

# Initial database and owner created during bootstrap
cnpg_bootstrap_database: app
cnpg_bootstrap_owner: app

# Additional databases to create via Database CRD
# Example:
# - name: app2
#   owner: app2_owner
#   extensions: ["uuid-ossp"]
cnpg_databases: []

# Additional users to create via managed.roles
# Access levels: read, write, admin (admin adds DDL privileges)
# Each user has a list of databases with per-database access level
# Example:
# - name: app_user
#   databases:
#     - name: app
#       access_level: admin
#     - name: other_db
#       access_level: read
cnpg_users: []
