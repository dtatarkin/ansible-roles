# Derived from the house lint standard by this repository's own signals:
# baseline (always), markup (YAML, markdown, and the TOML of the linter
# configurations) and infrastructure (the Ansible roles under roles/). No
# Python, shell, web or data signal. There is no Terraform and no Dockerfile
# here, so those infrastructure hooks are not carried; the justfile and nix
# hooks are inert, because there is neither.
#
# No lockfile here pins a tool. ansible-lint and checkov are hosted hooks,
# installed by the hook runner at their own `rev:`, so neither comes from a
# virtual environment above this repository. terraform, tflint and trivy are
# called by name and come from the toolchain above it.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.3.0
    hooks:
      - id: rumdl-check
        args: [--fix]

  # Whole-project and offline: it never fetches a collection mid-commit.
  # Serial because it writes a shared collection path. The community `ansible`
  # package carries the collections the roles call, which upstream's core
  # engine alone does not; `always_run: false` keeps the path filter in charge.
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.11.0
    hooks:
      - id: ansible-lint
        args: [--offline]
        additional_dependencies: [ansible]
        files: ^(roles|meta)/|^galaxy\.yml$
        exclude: \.sops\.ya?ml$
        always_run: false
        require_serial: true
        pass_filenames: false

  # Reads .checkov.yaml from the repository root, the directory a hook runs
  # in. That file skips one rule and says why. The entry is the house command,
  # because upstream's scans the whole root.
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.4.3
    hooks:
      - id: checkov
        entry: checkov --quiet --directory roles
        files: ^roles/
        pass_filenames: false

  - repo: local
    hooks:
      - id: format-justfile
        name: format justfile
        entry: bash -c 'for f in "$@"; do just --fmt --unstable --justfile "$f"; done' --
        language: system
        files: (^|/)justfile$|\.just$

      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        files: \.nix$

      - id: trivy-config
        name: trivy config
        entry: trivy config --exit-code 1 --severity HIGH,CRITICAL roles
        language: system
        files: ^roles/
        pass_filenames: false
