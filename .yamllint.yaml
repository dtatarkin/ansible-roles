# House values from the lint standard's markup topic. `document-start` is off
# because hook configurations and generated metadata carry no leading marker;
# 120 is the house width, shared with the markdown rules.
# The Ansible linter reads this same file and requires the last four rules below.
extends: default

rules:
  document-start: disable
  line-length:
    max: 120
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
